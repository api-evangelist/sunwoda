name: SUNWODA
description: 'Sunwoda Electronic Co., Ltd. (欣旺达电子股份有限公司, Shenzhen Stock Exchange
  300207) is a global lithium-ion battery manufacturer headquartered in Shenzhen, China.
  Its business spans consumer batteries (smartphone and laptop battery packs), electric-vehicle
  power batteries, energy-storage systems, energy services, smart hardware, and an
  innovation ecosystem. Sunwoda supplies battery cells and packs to major consumer-electronics
  and automotive OEMs worldwide. As a hardware and manufacturing company it operates
  corporate, investor, supplier (SRM), and bidding platforms, but publishes no public
  developer portal, API documentation, or SDKs. This profile was surfaced as a portfolio
  company of IDG Capital and added to the API Evangelist network as a lead; enrichment
  confirms there is no public API surface to catalog at this time.'
